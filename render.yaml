services:
  # Backend API Service
  - type: web
    name: stocker-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --workers 2 server:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///stocker_demo.db
      - key: CORS_ORIGINS
        value: "*"
      - key: SKIP_ALEMBIC
        value: "true"
      - key: RATELIMIT_ENABLED
        value: "false"

  # Frontend Static Site
  - type: static_site
    name: stocker-frontend
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
