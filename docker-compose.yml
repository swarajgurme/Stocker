version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: stocker-postgres
    environment:
      POSTGRES_DB: stocker_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stocker-network

  redis:
    image: redis:7-alpine
    container_name: stocker-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - stocker-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stocker-backend
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "True"
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/stocker_db
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
      STOCKER_BOOTSTRAP_ADMIN_EMAIL: admin@stocker.com
      STOCKER_BOOTSTRAP_ADMIN_PASSWORD: ${STOCKER_BOOTSTRAP_ADMIN_PASSWORD:-ChangeMeInCompose}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-change-me}
      SECRET_KEY: ${SECRET_KEY:-dev-flask-secret-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./logs:/app/logs
    command: >
      sh -c "python server.py"
    networks:
      - stocker-network

  frontend:
    image: node:20-alpine
    container_name: stocker-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: ""
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    networks:
      - stocker-network

volumes:
  postgres_data:
  redis_data:

networks:
  stocker-network:
    driver: bridge
